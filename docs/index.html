<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のゴミ収集 — かすみがうら市 A地区</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #1a1f2e;
      --text-muted: #5c6578;
      --line-green: #06c755;
      --border: #e4e8ef;
      --accent: #2563eb;
      --deadline: #b45309;
      --shadow: 0 2px 12px rgba(26, 31, 46, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .page-header p {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* LINE chat frame */
    .line-frame {
      background: #8cabd9;
      border-radius: 16px;
      padding: 20px 16px 24px;
    }

    .line-frame-label {
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 0.08em;
    }

    .line-time {
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.7);
      text-align: right;
      margin-bottom: 6px;
      padding-right: 4px;
    }

    /* Report card — this is the deliverable */
    .report-card {
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .report-header {
      background: #1e3a5f;
      color: #fff;
      padding: 18px 20px;
    }

    .report-header .badge {
      display: inline-block;
      font-size: 0.6875rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .report-header h2 {
      font-size: 1.0625rem;
      font-weight: 700;
    }

    .report-header .date {
      font-size: 0.875rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .report-body {
      padding: 20px;
    }

    .deadline-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .deadline-banner .clock {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      background: var(--deadline);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .deadline-banner strong {
      display: block;
      font-size: 0.9375rem;
      color: var(--deadline);
    }

    .deadline-banner span {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .gomi-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gomi-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .gomi-item-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-left: 4px solid var(--item-color, #999);
    }

    .gomi-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--item-color) 15%, white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gomi-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--item-color);
    }

    .gomi-item-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .gomi-item-header p {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .gomi-tips {
      list-style: none;
      padding: 0 16px 14px 16px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
    }

    .gomi-tips li {
      font-size: 0.8125rem;
      color: var(--text-muted);
      padding: 8px 0 8px 16px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .gomi-tips li:last-child { border-bottom: none; }

    .gomi-tips li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--item-color, #999);
    }

    .no-collection {
      text-align: center;
      padding: 32px 20px;
    }

    .no-collection .icon-circle {
      width: 56px;
      height: 56px;
      background: #eef2f7;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .no-collection h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .no-collection p {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* Week preview */
    .week-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .week-day {
      text-align: center;
      font-size: 0.6875rem;
      padding: 8px 2px;
      border-radius: 8px;
      background: #f8f9fb;
      min-height: 72px;
    }

    .week-day .dow {
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .week-day .num {
      font-size: 0.8125rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .week-day.sun .dow { color: #dc2626; }
    .week-day.sat .dow { color: #2563eb; }

    .week-day.today {
      background: #eff6ff;
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .week-day .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
    }

    .week-day .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.6875rem;
      color: var(--text-muted);
    }

    .legend-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .report-footer {
      padding: 14px 20px;
      background: #f8f9fb;
      border-top: 1px solid var(--border);
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-align: center;
    }

    .report-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Demo controls */
    .demo-controls {
      margin-top: 24px;
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .demo-controls label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .demo-controls input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
      font-family: inherit;
    }

    .demo-controls p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>ゴミ収集 自動報告</h1>
      <p>かすみがうら市 A地区 — LINE通知プレビュー</p>
    </header>

    <div class="line-frame">
      <div class="line-frame-label">LINE 通知イメージ（毎朝 7:00）</div>
      <div class="line-time" id="notify-time">7:00</div>

      <article class="report-card" id="report">
        <!-- rendered by JS -->
      </article>
    </div>

    <div class="demo-controls">
      <label for="demo-date">日付を変更してプレビュー</label>
      <input type="date" id="demo-date" value="2026-08-25">
      <p>収集がない日は「本日は収集なし」と表示し、LINEでは通知を送りません。</p>
    </div>
  </div>

  <script>
    const CONFIG = {
      district: "A",
      districtLabel: "A地区（志筑・新治・稲吉・稲吉東）",
      city: "かすみがうら市",
      notifyTime: "07:00",
      deadlineTime: "08:00",
      sourceUrl: "https://www.city.kasumigaura.lg.jp/page/page010047.html"
    };

    const GOMI_TYPES = {
      burnable:    { name: "燃やすごみ",     shortName: "燃えるゴミ", color: "#D64545", tips: ["市指定のごみ袋に入れて出す", "指定袋以外は収集されない", "生ごみは水を切ってから出す"] },
      can:         { name: "カン・不燃",     shortName: "カン・金属", color: "#5B8DEF", tips: ["50L程度のコンテナにはみ出さない", "中身を空にして出す", "スプレー缶はガスを抜き穴をあける"] },
      pet:         { name: "ペットボトル他", shortName: "PETボトル",  color: "#3AAFA9", tips: ["キャップとラベルは外して分別", "中を水洗いしてつぶす", "指定コンテナに入れる"] },
      plastic:     { name: "プラ容器他",     shortName: "プラ容器",   color: "#E8A838", tips: ["プラ容器・段ボール・新聞紙", "汚れを落としてから出す", "雨の日はビニール袋で覆う"] },
      fluorescent: { name: "蛍光灯・電球他", shortName: "蛍光灯",     color: "#9B7EDE", tips: ["蛍光灯・電球・乾電池・使い捨てライター", "それぞれ別のコンテナへ", "割れ物は新聞紙などで包む"] },
      glass:       { name: "ガラス・陶磁器類", shortName: "ガラス",   color: "#6B9E78", tips: ["割れ物は新聞紙などで包む", "指定の出し方に従う"] },
      "other-bottle": { name: "その他びん",  shortName: "その他びん", color: "#7A8B99", tips: ["指定の分別方法に従う", "中をすすいで出す"] },
      "clear-bottle": { name: "無色びん",  shortName: "無色びん",   color: "#A8C8E8", tips: ["無色透明のびん類", "中をすすいでキャップを外す"] },
      "brown-bottle": { name: "茶色びん",  shortName: "茶色びん",   color: "#A06840", tips: ["茶色のびん類", "中をすすいでキャップを外す"] }
    };

    const SCHEDULE = {
      "2026-08-02": ["can"],
      "2026-08-03": ["burnable"],
      "2026-08-04": ["glass"],
      "2026-08-05": ["pet"],
      "2026-08-06": ["burnable"],
      "2026-08-09": ["plastic"],
      "2026-08-10": ["burnable"],
      "2026-08-11": ["other-bottle"],
      "2026-08-13": ["burnable"],
      "2026-08-16": ["can"],
      "2026-08-17": ["burnable"],
      "2026-08-18": ["clear-bottle"],
      "2026-08-19": ["pet"],
      "2026-08-20": ["burnable"],
      "2026-08-23": ["plastic"],
      "2026-08-24": ["burnable"],
      "2026-08-25": ["brown-bottle"],
      "2026-08-27": ["burnable"],
      "2026-08-30": ["can"]
    };

    const DOW = ["日", "月", "火", "水", "木", "金", "土"];

    const ICONS = {
      burn: '<svg viewBox="0 0 24 24"><path d="M12 2C12 2 7 8 7 13a5 5 0 0010 0c0-3-2-5-3-6 0 0 1 3 2 1 5 0 0-1-1-2-2 0 3-1 5-3 7z"/></svg>',
      can:  '<svg viewBox="0 0 24 24"><path d="M8 2h8v2H8V2zm-1 4h10l-1 16H8L7 6zm4 3v10h2V9h-2z"/></svg>',
      pet:  '<svg viewBox="0 0 24 24"><path d="M8 4a2 2 0 110 4 2 2 0 010-4zm8 0a2 2 0 110 4 2 2 0 010-4zM6 10a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm12 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM12 11c-3 0-5 2-5 5 0 2 2 3 5 3s5-1 5-3c0-3-2-5-5-5z"/></svg>',
      plastic: '<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm2 4h12v10H6V10zm2 2v6h8v-6H8z"/></svg>',
      bulb: '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-4 12.7V18h8v-3.3A7 7 0 0012 2zm-2 18h4v2h-4v-2z"/></svg>',
      glass: '<svg viewBox="0 0 24 24"><path d="M8 2h8l-2 20h-4L8 2zm4 4v14h.01L14 6h-2z"/></svg>',
      bottle: '<svg viewBox="0 0 24 24"><path d="M10 2h4v3h2l-1 17H9L8 5h2V2zm2 5v12h.01L13 7h-1z"/></svg>'
    };

    function iconFor(type) {
      const map = { burnable: "burn", can: "can", pet: "pet", plastic: "plastic", fluorescent: "bulb", glass: "glass" };
      return ICONS[map[type] || "bottle"];
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = date.getMonth() + 1;
      const d = date.getDate();
      const dow = DOW[date.getDay()];
      return `${y}年${m}月${d}日（${dow}）`;
    }

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getWeekDays(centerDate) {
      const days = [];
      const start = new Date(centerDate);
      start.setDate(start.getDate() - start.getDay());
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        days.push(d);
      }
      return days;
    }

    function renderGomiItem(typeId) {
      const t = GOMI_TYPES[typeId];
      if (!t) return "";
      const tips = t.tips.map(tip => `<li>${tip}</li>`).join("");
      return `
        <div class="gomi-item" style="--item-color: ${t.color}">
          <div class="gomi-item-header">
            <div class="gomi-icon">${iconFor(typeId)}</div>
            <div>
              <h3>${t.name}</h3>
              <p>${t.shortName}</p>
            </div>
          </div>
          <ul class="gomi-tips">${tips}</ul>
        </div>`;
    }

    function renderWeekPreview(date) {
      const days = getWeekDays(date);
      const todayKey = dateKey(date);
      const cells = days.map(d => {
        const key = dateKey(d);
        const types = SCHEDULE[key] || [];
        const isToday = key === todayKey;
        const dowClass = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
        const dots = types.map(id => {
          const color = GOMI_TYPES[id]?.color || "#999";
          return `<span class="dot" style="background:${color}" title="${GOMI_TYPES[id]?.name || ""}"></span>`;
        }).join("");
        return `
          <div class="week-day ${dowClass}${isToday ? " today" : ""}">
            <div class="dow">${DOW[d.getDay()]}</div>
            <div class="num">${d.getDate()}</div>
            <div class="dots">${dots}</div>
          </div>`;
      }).join("");

      const legendItems = Object.entries(GOMI_TYPES)
        .filter(([id]) => Object.values(SCHEDULE).flat().includes(id))
        .slice(0, 6)
        .map(([, t]) => `<span class="legend-item"><span class="dot" style="background:${t.color}"></span>${t.shortName}</span>`)
        .join("");

      return `
        <div class="week-section">
          <div class="section-title">今週の収集予定</div>
          <div class="week-grid">${cells}</div>
          <div class="legend">${legendItems}</div>
        </div>`;
    }

    function renderReport(date) {
      const key = dateKey(date);
      const types = SCHEDULE[key] || [];
      const hasCollection = types.length > 0;

      let bodyContent;
      if (hasCollection) {
        bodyContent = `
          <div class="deadline-banner">
            <div class="clock">${CONFIG.deadlineTime.replace(":00", "")}<br><span style="font-size:0.6rem">時</span></div>
            <div>
              <strong>午前${CONFIG.deadlineTime}までに集積所へ</strong>
              <span>決められた場所に出してください</span>
            </div>
          </div>
          <div class="section-title">今日出すゴミ</div>
          <div class="gomi-list">${types.map(renderGomiItem).join("")}</div>
          ${renderWeekPreview(date)}`;
      } else {
        const next = findNextCollection(date);
        bodyContent = `
          <div class="no-collection">
            <div class="icon-circle">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#94a3b8"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
            <h3>本日は収集なし</h3>
            <p>${next ? `次の収集: ${next.label}` : "次の収集日を確認してください"}</p>
          </div>
          ${renderWeekPreview(date)}`;
      }

      document.getElementById("report").innerHTML = `
        <header class="report-header">
          <span class="badge">${CONFIG.city} ${CONFIG.districtLabel}</span>
          <h2>${hasCollection ? "今日のゴミ収集" : "ゴミ収集カレンダー"}</h2>
          <p class="date">${formatDate(date)}</p>
        </header>
        <div class="report-body">${bodyContent}</div>
        <footer class="report-footer">
          毎朝 ${CONFIG.notifyTime} に LINE 通知 /
          <a href="${CONFIG.sourceUrl}" target="_blank" rel="noopener">市公式カレンダー</a>
        </footer>`;
    }

    function findNextCollection(fromDate) {
      const d = new Date(fromDate);
      for (let i = 1; i <= 14; i++) {
        d.setDate(d.getDate() + 1);
        const key = dateKey(d);
        const types = SCHEDULE[key];
        if (types && types.length) {
          const names = types.map(id => GOMI_TYPES[id]?.name).join("・");
          return { date: new Date(d), label: `${formatDate(d)} ${names}` };
        }
      }
      return null;
    }

    const dateInput = document.getElementById("demo-date");
    function update() {
      const date = new Date(dateInput.value + "T00:00:00");
      renderReport(date);
      document.getElementById("notify-time").textContent = CONFIG.notifyTime;
    }

    dateInput.addEventListener("change", update);
    update();
  </script>
</body>
</html>
